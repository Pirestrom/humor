function environmentNote(){return location.protocol==='file:'?'<div class="notice warn mb">Abertura por arquivo detectada. Para uso contínuo, hospede este HTML em HTTPS. O armazenamento em arquivos locais varia entre navegadores; preserve os backups.</div>':'';}
function authFrame(content){$('#app').innerHTML=`<main class="auth-wrap"><section class="auth-story">${brand()}<h1>Um dia<br>de cada vez.</h1><p>Um espaço para perceber suas emoções, acolher suas mudanças e acompanhar o seu caminho.</p><div class="art" aria-hidden="true"><div class="art-circle"></div><div class="art-circle"></div><div class="art-circle"></div><div class="art-line"></div></div></section><section class="card auth-card">${environmentNote()}${content}<div class="auth-footer">${icon('lock')} Seus dados ficam criptografados neste navegador. Não há conta em servidor nem sincronização entre aparelhos.</div></section></main>`;}
function renderAuth(mode='welcome',message=''){
 const error=`<div id="auth-error" class="notice ${message?'warn':'error'} mb" ${message?'':'hidden'} role="alert">${esc(message)}</div>`;
 if(mode==='welcome'){authFrame(`<span class="eyebrow">BEM-VINDA AO SEU ESPAÇO</span><h2 class="mt">Diário de Humor 4.0</h2><p class="intro">Seu espaço privado de acompanhamento emocional.</p>${error}<div class="stack"><button class="btn full" data-action="register">Criar minha conta ${icon('arrow')}</button><button class="btn ghost full" data-action="restore">Restaurar backup existente</button></div><p class="small muted mt">Comece com um diário vazio ou traga seu histórico com um JSON criptografado.</p>`);return;}
 if(mode==='register'){authFrame(`<h2>Seu primeiro passo</h2><p class="intro">Crie um acesso local. Só sua senha poderá abrir seus registros.</p>${error}<form id="register-form"><label class="field" for="username">Nome de usuário</label><input id="username" name="username" type="text" minlength="3" maxlength="40" required autocomplete="username" autocapitalize="none"><label class="field" for="password">Senha · pelo menos ${MIN_PASSWORD_LENGTH} caracteres</label><input id="password" name="password" type="password" minlength="${MIN_PASSWORD_LENGTH}" maxlength="256" required autocomplete="new-password"><label class="field" for="confirmation">Confirme a senha</label><input id="confirmation" name="confirmation" type="password" minlength="${MIN_PASSWORD_LENGTH}" maxlength="256" required autocomplete="new-password"><label class="check mt"><input type="checkbox" required><span>Entendi que não há recuperação por e-mail. Vou guardar minha senha e os backups.</span></label><button type="submit" class="btn full mt">Criar meu diário ${icon('arrow')}</button><button type="button" class="btn ghost full mt" data-action="welcome">Voltar</button></form>`);return;}
 authFrame(`<span class="pill">${icon('lock')} Seu diário está bloqueado</span><h2 class="mt">Bom ter você aqui.</h2><p class="intro">Entre para abrir seu espaço privado.</p>${error}<form id="login-form"><label class="field" for="username">Nome de usuário</label><input id="username" name="username" type="text" maxlength="40" required autocomplete="username" autocapitalize="none"><label class="field" for="password">Senha</label><input id="password" name="password" type="password" maxlength="256" required autocomplete="current-password"><button type="submit" class="btn full mt">Desbloquear diário ${icon('arrow')}</button></form><button class="btn ghost full mt" data-action="restore">Restaurar backup existente</button><details class="mt small muted"><summary>Esqueci meu acesso</summary>Não existe recuperação por e-mail. Uma senha esquecida não pode ser recuperada pelo aplicativo. Backups anteriores só abrem com a senha que os protegeu. Se souber a senha, restaurar o backup permite visualizar seu nome de usuário após a descriptografia.</details>`);
}
function shell(content){$('#app').innerHTML=`<div class="shell"><aside class="sidebar">${brand()}<nav class="nav" aria-label="Navegação principal">${[['home','home','Hoje'],['history','calendar','Histórico'],['charts','chart','Evolução'],['report','file','Relatório'],['settings','settings','Ajustes']].map(([key,ico,label])=>`<button data-nav="${key}" class="${view===key?'active':''}" ${view===key?'aria-current="page"':''}>${icon(ico)} ${label}</button>`).join('')}</nav><div class="sidebar-bottom"><p class="small muted mb">Um registro de cada vez.<br>Sem julgamentos.</p><button class="btn ghost full" data-action="lock">${icon('lock')} Sair e bloquear</button></div></aside><main class="workspace"><header class="topbar"><div class="date-top">${esc(new Intl.DateTimeFormat('pt-BR',{dateStyle:'full',timeZone:ZONE}).format(new Date()))}</div><div class="mobile-brand hidden"><span class="brand-name">Diário de Humor <span>SEU ESPAÇO PRIVADO</span></span></div><div class="row"><button class="btn ghost slim" data-action="backup" aria-label="Baixar backup agora">${icon('download')} <span class="backup-label">Baixar backup agora</span><span class="mobile-brand hidden">Backup</span></button><button class="btn ghost slim" data-action="lock" aria-label="Sair e bloquear">${icon('lock')}<span class="backup-label">Bloquear</span></button></div></header>${environmentNote()}${content}<footer class="app-footer">Armazenamento local criptografado · Horário de São Paulo · Sem sincronização automática</footer></main></div>`;}
function pageHead(title,subtitle,extra=''){return `<div class="page-head"><div><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div>${extra}</div>`;}
function render(){if(!session)return renderAuth(vault?'login':'welcome');const functions={home:homeView,form:formView,history:historyView,charts:chartsView,report:reportView,settings:settingsView,restore:restoreView};shell((functions[view]||homeView)());if(view==='report'&&reportReady)updateReportPreview();}
function homeView(){const data=session.data,record=data.records.find(r=>r.date===today()),last=data.records.at(-1);return `${pageHead('Olá, '+data.profile.username+'.','Este é o seu espaço para observar como você se sente.')}<section class="hero"><div class="hero-sun" aria-hidden="true"></div><span class="eyebrow">${record?'SEU DIA JÁ FOI REGISTRADO':'UM MOMENTO PARA VOCÊ'}</span><h2>${record?'O dia mudou? Seu diário pode acompanhar.':'Como você está se sentindo hoje?'}</h2><p class="muted">${record?'Você pode ajustar suas respostas e incluir novas mudanças no mesmo registro.':'Conte sobre o dia inteiro, desde que acordou até agora. A parte principal leva cerca de 1 a 2 minutos.'}</p><button class="btn" data-action="fill-today">${icon(record?'calendar':'plus')} ${record?'Revisar o registro de hoje':'Preencher hoje'}</button></section><section class="stats"><div class="stat"><span class="small muted">Seu histórico</span><strong>${data.records.length}</strong><p>${data.records.length===1?'dia registrado':'dias registrados'}</p></div><div class="stat"><span class="small muted">Último registro</span><strong style="font-size:22px">${last?shortDate(last.date):'—'}</strong><p>${last?last.date.slice(0,4):'Seu primeiro dia espera'}</p></div><div class="stat"><span class="small muted">Hoje</span><strong style="font-size:22px">${record?'Salvo':'Em aberto'}</strong><p>${record?'Pode ser editado':'Preencha no seu tempo'}</p></div></section>${saveInfo?savePanel():''}<div class="grid2"><button class="shortcut" data-nav="history"><div class="row">${icon('calendar')}<div><strong>Histórico de registros</strong><small>Revisite os seus dias.</small></div></div>${icon('arrow')}</button><button class="shortcut" data-nav="charts"><div class="row">${icon('chart')}<div><strong>Gráficos e evolução</strong><small>Observe seus registros ao longo do tempo.</small></div></div>${icon('arrow')}</button><button class="shortcut" data-nav="report"><div class="row">${icon('file')}<div><strong>Gerar relatório PDF</strong><small>Escolha o que compartilhar.</small></div></div>${icon('arrow')}</button><div class="card"><h3 class="small">${icon('lock')} Seu histórico, sob seus cuidados</h3><p class="small muted mt">Último download solicitado: <strong>${esc(dateTimeLabel(data.lastBackupRequestedAt))}</strong>.</p><p class="small muted mt">Guarde o JSON em um lugar seguro. Limpar os dados do site pode apagar este diário; apenas limpar o histórico de navegação geralmente não apaga os registros.</p></div></div>`;}
function savePanel(){return `<div class="save-state" role="status"><h3>${icon('check')} ${esc(saveInfo.title||'Registro salvo localmente')}</h3><ol><li>Histórico criptografado salvo neste navegador.</li><li>${saveInfo.prepared?'Backup completo preparado.':'Backup ainda não preparado.'}</li><li>${saveInfo.requested?'Download solicitado ao navegador.':'Download não solicitado. Use o botão abaixo.'}</li></ol><p class="small">Não é possível confirmar a conclusão do download. Verifique a pasta de downloads ou o seletor de arquivos; se nada aparecer, toque novamente em baixar.</p>${saveInfo.error?`<p class="small danger-text mt">${esc(saveInfo.error)}</p>`:''}<div class="row mt"><button class="btn slim" data-action="${preparedBackup?'download-ready':'backup'}">${icon('download')} Baixar backup agora</button>${saveInfo.date?`<button class="btn ghost slim" data-edit="${saveInfo.date}">Voltar ao formulário</button>`:''}</div></div>`;}
function choiceGroup(field,title,options,hint=''){const value=draft[field];return `<fieldset class="question"><legend>${esc(title)}</legend>${hint?`<p class="hint">${esc(hint)}</p>`:''}<div class="choices">${options.map(([v,label])=>`<button type="button" class="choice ${value===v?'selected':''}" data-field="${field}" data-value="${esc(JSON.stringify(v))}" aria-pressed="${value===v}">${esc(label)}</button>`).join('')}</div>${value!==null?`<button type="button" class="clear" data-field="${field}" data-value="null">Deixar sem resposta</button>`:''}</fieldset>`;}
function multiGroup(field,options){return `<div class="choices">${options.map(([v,label])=>`<button type="button" class="choice ${draft[field].includes(v)?'selected':''}" data-multi="${field}" data-value="${v}" aria-pressed="${draft[field].includes(v)}">${esc(label)}</button>`).join('')}</div>`;}
function feelingSelect(value){return `<option value="">Selecione</option>${FEELINGS.map(f=>`<option value="${f[0]}" ${f[0]===value?'selected':''}>${esc(f[2])}</option>`).join('')}`;}
function changesForm(){return `<div class="notice small">Registre na sequência em que você percebeu as mudanças. O horário é opcional; nenhum horário ou duração será estimado.</div>${draft.changes.map((c,i)=>`<div class="change-card"><div class="row between"><strong class="small">Mudança ${i+1}</strong><button type="button" class="clear" data-remove-change="${i}">Excluir mudança</button></div><div class="change-grid"><label>Antes<select data-change="${i}" data-part="from" aria-label="Estado antes da mudança ${i+1}">${feelingSelect(c.from)}</select></label><label>Depois<select data-change="${i}" data-part="to" aria-label="Estado depois da mudança ${i+1}">${feelingSelect(c.to)}</select></label><label>Horário (opcional)<input type="time" data-change="${i}" data-part="time" value="${c.time||''}" aria-label="Horário da mudança ${i+1}"></label></div></div>`).join('')}<button type="button" class="btn secondary mt" data-action="add-change" ${draft.changes.length>=24?'disabled':''}>${icon('plus')} Registrar outra mudança</button>`;}
function formView(){if(!draft)draft=emptyRecord(today());const titles=['Suas emoções','Sono e rotina','Mudanças e detalhes'];let content='';if(step===0){content=`<fieldset class="question"><legend>Como você se sentiu hoje?</legend><p class="hint">Escolha uma ou mais opções. Neutra e sensação de vazio são respostas diferentes.</p><div class="feelings">${FEELINGS.map(f=>`<button type="button" class="choice ${draft.feelings.includes(f[0])?'selected':''}" data-multi="feelings" data-value="${f[0]}" aria-pressed="${draft.feelings.includes(f[0])}"><span class="emoji" aria-hidden="true">${f[1]}</span>${esc(f[2])}</button>`).join('')}</div></fieldset>${choiceGroup('intensity','Qual foi a intensidade?',INTENSITY,'Esta resposta se aplica às emoções escolhidas. Você pode diferenciá-las abaixo.')}${draft.feelings.length?`<details class="optional" ${Object.keys(draft.intensities).length?'open':''}><summary>Intensidade diferente para cada emoção (opcional)</summary>${draft.feelings.map(k=>`<label class="intensity-row"><span>${esc(fInfo(k)[2])}</span><select data-intensity="${k}" aria-label="Intensidade de ${esc(fInfo(k)[2])}"><option value="general" ${!Object.hasOwn(draft.intensities,k)?'selected':''}>Usar resposta geral</option><option value="null" ${Object.hasOwn(draft.intensities,k)&&draft.intensities[k]===null?'selected':''}>Não respondido</option>${INTENSITY.map(([v,l])=>`<option value="${esc(JSON.stringify(v))}" ${draft.intensities[k]===v?'selected':''}>${esc(l)}</option>`).join('')}</select></label>`).join('')}</details>`:''}${choiceGroup('energy','Como estava sua energia?',ENERGY)}${choiceGroup('libido','E a libido?',LIBIDO,'Compare com o que é habitual para você. Sem detalhes íntimos.')}`;
 }else if(step===1){content=`${choiceGroup('irritability','Quanto sentiu de irritabilidade?',SEVERITY)}${choiceGroup('anxiety','Quanto sentiu de ansiedade?',SEVERITY)}${choiceGroup('sleep','Quanto você dormiu?',SLEEP,'Considere o sono principal antes deste dia. As faixas são as opções declaradas, não horas exatas.')}${choiceGroup('sleepQuality','Como foi a qualidade do sono?',QUALITY)}${choiceGroup('reducedSleep','Dormiu menos que o habitual e sentiu pouca ou nenhuma necessidade de dormir mais?',YESNO,'Opcional.')}${choiceGroup('activities','Como foi sua disposição para realizar suas atividades?',ACTIVITIES,'Considere suas atividades habituais neste dia.')}`;
 }else{content=`${choiceGroup('moodChanged','Seu humor mudou ao longo do dia?',YESNO)}${draft.moodChanged==='yes'?changesForm():''}<details class="optional" ${draft.extras.length||draft.note||draft.medicationNote||draft.adverseNote?'open':''}><summary>Informações adicionais (opcional)</summary><p class="small muted mb">Marque apenas o que deseja registrar. Uma opção não marcada não significa que o sintoma esteve ausente.</p>${multiGroup('extras',EXTRA)}<label class="field" for="note">Deseja acrescentar alguma observação sobre hoje?</label><textarea id="note" data-text="note" maxlength="3000" placeholder="Este espaço é seu. Escreva apenas o que desejar.">${esc(draft.note)}</textarea><p class="small muted">Até 3.000 caracteres. As observações não entram no PDF sem sua seleção.</p>${draft.extras.includes('medication')||draft.medicationNote?`<label class="field" for="medication-note">O que percebeu em relação à medicação? (opcional)</label><textarea id="medication-note" data-text="medicationNote" maxlength="1000" placeholder="Por exemplo, uma alteração que você deseja levar à consulta.">${esc(draft.medicationNote)}</textarea>`:''}${draft.extras.includes('adverse')||draft.adverseNote?`<label class="field" for="adverse-note">Possíveis efeitos adversos (opcional)</label><textarea id="adverse-note" data-text="adverseNote" maxlength="1000">${esc(draft.adverseNote)}</textarea>`:''}</details><details class="optional"><summary>Preciso de apoio agora</summary><label class="check"><input type="checkbox" data-risk ${draft.riskHelp?'checked':''}><span>Estou com dificuldade para me manter segura ou percebi confusão intensa ou experiências que me preocupam.</span></label>${warningSupport()}</details><div id="risk-notice">${riskMention(draft)?warningSupport():''}</div><p class="small muted mt">Respostas em branco serão preservadas como não respondidas. Seu registro poderá ser editado depois.</p>`;}
 return `${pageHead(formBaseDate?'Revisar seu dia':'Vamos registrar seu dia','Um formulário para o dia inteiro, desde que você acordou até agora.')}<section class="card form-card"><div class="row between"><span class="eyebrow">PASSO ${step+1} DE 3 · ${titles[step]}</span><span class="pill">${dirty?'Em preenchimento':'No seu tempo'}</span></div><div class="progress" aria-label="Etapa ${step+1} de 3">${[0,1,2].map(i=>`<span class="${i<=step?'done':''}"></span>`).join('')}</div><div id="form-error" class="notice error mb" role="alert" hidden></div>${step===0?`<div class="mb"><label class="field" for="entry-date">Data do registro</label><input type="date" id="entry-date" value="${draft.date}" min="1900-01-01" max="${today()}"><p class="small muted mt">Você pode preencher um dia anterior. Datas futuras não são permitidas.</p></div>`:`<p class="small muted mb">${dateLabel(draft.date)} · ${formBaseDate?'Editando registro existente':'Novo registro'}</p>`}${content}<div class="step-nav"><button class="btn ghost" data-action="${step?'previous-step':'cancel-form'}">${step?'Voltar':'Cancelar'}</button><button class="btn" data-action="${step<2?'next-step':'save-entry'}">${step<2?'Continuar '+icon('arrow'):'Salvar registro e baixar backup'}</button></div></section>`;
}
function legend(showEmotion=true){return showEmotion?`<div class="legend">${FEELINGS.map(f=>`<span><i class="dot" style="--c:${f[3]}"></i>${esc(f[4])}</span>`).join('')}<span><i class="dot unknown"></i>Sem emoção informada</span></div><p class="calendar-note">Cores indicam emoções relatadas; a área dos pontos não representa duração. Dias sem registro ficam sem pontos.</p>`:'<p class="calendar-note">Ponto verde: dia registrado. Células sem ponto: sem registro no período.</p>';}
function calendar(month,{interactive=false,from=null,to=null,showEmotion=true}={}){const first=month+'-01',dt=dateObj(first),start=dt.getUTCDay(),count=new Date(Date.UTC(dt.getUTCFullYear(),dt.getUTCMonth()+1,0)).getUTCDate();const map=new Map(session.data.records.map(r=>[r.date,r]));let cells=Array.from({length:start},()=>'<span class="calday blank"></span>');for(let day=1;day<=count;day++){const date=month+'-'+String(day).padStart(2,'0'),outside=from&&(date<from||date>to),record=outside?null:map.get(date),future=date>today(),moods=record?.feelings||[];let markers=record?(showEmotion?(moods.length?moods.map(k=>`<i class="dot" style="--c:${fInfo(k)[3]}"></i>`).join(''):'<i class="dot unknown"></i>'):'<i class="dot" style="--c:#557e5b"></i>'):'';const attrs=`class="calday ${record?'recorded':''} ${date===today()?'today':''} ${interactive&&date===historyDate?'selected':''} ${outside||future?'future':''}"`;cells.push(interactive?`<button ${attrs} data-day="${date}" ${future?'disabled':''} aria-label="${dateLabel(date)}${record?', dia registrado':', sem registro'}">${day}<span class="dots" aria-hidden="true">${markers}</span></button>`:`<div ${attrs}>${day}<span class="dots" aria-hidden="true">${markers}</span></div>`);}
 return `<div class="calendar"><div class="calendar-header">${interactive?'<button class="btn ghost slim" data-action="month-prev" aria-label="Mês anterior">‹</button>':''}<h3 class="calendar-title">${esc(dt.toLocaleDateString('pt-BR',{month:'long',year:'numeric',timeZone:'UTC'}))}</h3>${interactive?`<button class="btn ghost slim" data-action="month-next" aria-label="Próximo mês" ${month>=today().slice(0,7)?'disabled':''}>›</button>`:''}</div><div class="calendar-grid">${['dom','seg','ter','qua','qui','sex','sáb'].map(x=>`<span class="weekday">${x}</span>`).join('')}${cells.join('')}</div></div>`;
}
function effectiveIntensity(r,k){return Object.hasOwn(r.intensities,k)?r.intensities[k]:r.intensity;}
function intensityText(r){if(!r.feelings.length)return 'Geral: '+labelFor(INTENSITY,r.intensity);return r.feelings.map(k=>fInfo(k)[4]+': '+labelFor(INTENSITY,effectiveIntensity(r,k))).join(' · ');}
function transitionList(r){if(r.moodChanged===null)return '<p class="small muted mt">Mudanças durante o dia: não respondido.</p>';if(r.moodChanged!=='yes')return `<p class="small muted mt">Mudanças durante o dia: ${labelFor(YESNO,r.moodChanged)}.</p>`;if(!r.changes.length)return '<p class="small muted mt">Relatou mudança, sem detalhar a sequência.</p>';return r.changes.map((c,i)=>`<div class="transition"><span class="time">${i+1}. ${c.time||'Sem horário'}</span>${moodTag(c.from)}<span aria-label="mudou para">→</span>${moodTag(c.to)}</div>`).join('');}
function recordSummary(r){if(!r)return `<div class="empty">${icon('calendar')}<h3>Um espaço em aberto</h3><p class="small">${dateLabel(historyDate)} ainda não tem registro.</p><button class="btn mt" data-edit="${historyDate}">Preencher esta data</button></div>`;return `<div class="row between"><h3>${dateLabel(r.date)}</h3><span class="pill">Registrado</span></div><div class="row mt">${r.feelings.length?r.feelings.map(moodTag).join(''):'<span class="small muted">Emoções não informadas</span>'}</div><p class="small muted mt">${esc(intensityText(r))}</p><div class="summary-grid">${Object.entries(METRICS).filter(([k])=>k!=='intensity').map(([k,m])=>`<div class="summary-item"><span>${m.title}</span><strong>${esc(labelFor(m.options,r[k]))}</strong></div>`).join('')}<div class="summary-item"><span>Menos sono e pouca necessidade</span><strong>${esc(labelFor(YESNO,r.reducedSleep))}</strong></div></div><h4 class="small">Mudanças ao longo do dia</h4>${transitionList(r)}${r.extras.length?`<p class="small mt"><strong>Informações adicionais:</strong> ${esc(r.extras.map(k=>EXTRA.find(x=>x[0]===k)[1]).join(', '))}.</p>`:''}${[['note','Observação'],['medicationNote','Medicação'],['adverseNote','Possíveis efeitos adversos']].filter(([k])=>r[k]).map(([k,l])=>`<p class="small mt mb"><strong>${l}</strong></p><p class="note-text">${esc(r[k])}</p>`).join('')}${r.riskHelp?warningSupport():''}<div class="row mt"><button class="btn" data-edit="${r.date}">Editar registro</button><button class="btn danger" data-delete="${r.date}">Excluir</button></div>`;}
function historyView(){return `${pageHead('Histórico de humor','Cada dia tem sua própria história. Selecione uma data para rever ou preencher.')}<div class="grid2"><section class="card">${calendar(calMonth,{interactive:true})}${legend()}<label class="field" for="history-jump">Ir para uma data</label><input type="date" id="history-jump" value="${historyDate}" min="1900-01-01" max="${today()}"></section><section class="card">${recordSummary(session.data.records.find(r=>r.date===historyDate))}</section></div>`;}
function filteredRecords(from=range.from,to=range.to){return session.data.records.filter(r=>r.date>=from&&r.date<=to);}
function rangeControl(){return `<div class="period-controls">${[7,15,30].map(n=>`<button class="btn slim ${range.to===today()&&range.from===addDays(today(),1-n)?'':'ghost'}" data-period="${n}">${n} dias</button>`).join('')}</div><form id="range-form" class="range-grid"><label>Data inicial<input name="from" type="date" required min="1900-01-01" max="${today()}" value="${range.from}"></label><label>Data final<input name="to" type="date" required min="1900-01-01" max="${today()}" value="${range.to}"></label><button class="btn secondary" type="submit">Aplicar período</button></form><p class="small muted mt">Até 366 dias por visualização. Cada ponto é uma resposta real; não são estimados valores entre datas.</p>`;}
function statsFor(records,from,to){return {count:records.length,missing:dayCount(from,to)-records.length,changes:records.reduce((s,r)=>s+r.changes.length,0),daysChanged:records.filter(r=>r.moodChanged==='yes').length,emotionAnswered:records.filter(r=>r.feelings.length).length};}
function statsHtml(records,from,to,emotions=true){const s=statsFor(records,from,to);return `<div class="stats"><div class="stat"><span class="small muted">Registros</span><strong>${s.count}</strong><p>de ${dayCount(from,to)} dias no período</p></div><div class="stat"><span class="small muted">Sem registro</span><strong>${s.missing}</strong><p>não equivalem a ausência de sintomas</p></div><div class="stat"><span class="small muted">${emotions?'Mudanças detalhadas':'Cobertura'}</span><strong>${emotions?s.changes:Math.round(s.count/dayCount(from,to)*100)+'%'}</strong><p>${emotions?s.daysChanged+' dias com mudança relatada':'dias preenchidos no período'}</p></div></div>`;}
function frequencyHtml(records){const answered=records.filter(r=>r.feelings.length).length;return `<div class="frequency">${FEELINGS.map(f=>{const count=records.filter(r=>r.feelings.includes(f[0])).length;return `<div class="frequency-item"><span>${esc(f[4])}</span><div class="bar-track"><div class="bar-fill" style="width:${answered?count/answered*100:0}%;--c:${f[3]}"></div></div><span>${count} dia${count===1?'':'s'}</span></div>`;}).join('')}</div><p class="calendar-note">Contagem por dia, com seleção múltipla. ${answered} registros informam emoções; ${records.length-answered} não informam.</p>`;}
function chartValues(r,key){if(!r)return [];if(key==='intensity'){if(r.feelings.length)return r.feelings.map(k=>({value:effectiveIntensity(r,k),color:fInfo(k)[3],name:fInfo(k)[4]})).filter(x=>typeof x.value==='number');return typeof r.intensity==='number'?[{value:r.intensity,color:METRICS.intensity.color,name:'Geral'}]:[];}return typeof r[key]==='number'?[{value:r[key],color:METRICS[key].color,name:METRICS[key].title}]:[];}
function chartValueText(r,key){if(!r)return 'Sem registro';return key==='intensity'?intensityText(r):labelFor(METRICS[key].options,r[key]);}
function chartHtml(key,records,from,to,{print=false}={}){const metric=METRICS[key],opts=metric.options.filter(x=>typeof x[0]==='number'),dates=days(from,to),map=new Map(records.map(r=>[r.date,r])),min=Math.min(...opts.map(x=>x[0])),max=Math.max(...opts.map(x=>x[0]));const W=520,H=224,L=145,R=18,T=20,B=45,pw=W-L-R,ph=H-T-B;const x=i=>L+(dates.length===1?pw/2:i*pw/(dates.length-1)),y=v=>T+(max-v)/(max-min||1)*ph;let svg=`<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(metric.title)}, de ${dateLabel(from)} a ${dateLabel(to)}. ${records.length} registros. Pontos apenas para respostas informadas.">`;
 for(const [v,label]of opts){let l=label;if(key==='activities')l=['Normalmente','Com dificuldade','Apenas parte','Não realizou'][v];svg+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e0e6dd" stroke-dasharray="3 4"/><text x="${L-12}" y="${y(v)+4}" text-anchor="end" fill="#566b60" font-size="18">${esc(l)}</text>`;}
 const ticks=new Set([0,dates.length-1,...Array.from({length:Math.min(4,dates.length)},(_,i)=>Math.round(i*(dates.length-1)/Math.max(1,Math.min(4,dates.length)-1)))]);for(const i of ticks)svg+=`<text x="${x(i)}" y="${H-13}" text-anchor="middle" fill="#61756a" font-size="16">${shortDate(dates[i])}</text>`;
 let valid=0;for(let i=0;i<dates.length;i++){const r=map.get(dates[i]),vals=chartValues(r,key);if(vals.length)valid++;for(let j=0;j<vals.length;j++){const v=vals[j],offset=key==='intensity'?(j-(vals.length-1)/2)*Math.min(3,pw/dates.length/9):0;svg+=`<circle cx="${x(i)+offset}" cy="${y(v.value)}" r="${dates.length>60?2.5:4.5}" fill="${v.color}" stroke="#506f5d" stroke-width=".6"><title>${dateLabel(dates[i])}: ${esc(v.name)} — ${esc(labelFor(metric.options,v.value))}</title></circle>`;}if(!vals.length)svg+=`<path d="M${x(i)-2} ${H-B+13}l4 4m-4 0 4-4" stroke="${r?'#b29a75':'#c4cdc3'}" stroke-width="1.2"><title>${dateLabel(dates[i])}: ${esc(chartValueText(r,key))}</title></path>`;}
 svg+='</svg>';const extra=key==='sleep'?'Faixas declaradas, sem converter em horas exatas.':key==='intensity'?'Uma cor por emoção; resposta específica prevalece sobre a geral.':'Escala ordinal autorrelatada, sem interpolação.';
 return `<article class="chart-card"><h3>${metric.title}</h3>${svg}<p class="caption">${valid}/${dates.length} dias com valor plotável · × = sem valor plotável (${dates.length-records.length} sem registro; ${records.length-valid} registros sem valor nesta escala). ${extra}</p>${key==='intensity'?`<div class="legend">${FEELINGS.filter(f=>records.some(r=>r.feelings.includes(f[0]))).map(f=>`<span><i class="dot" style="--c:${f[3]}"></i>${f[4]}</span>`).join('')}</div>`:''}${key==='libido'?`<p class="caption">${records.filter(r=>r.libido==='prefer').length} respostas “Prefiro não responder”.</p>`:''}${key==='sleep'||key==='intensity'?`<p class="caption">${records.filter(r=>r[key]==='unknown').length} respostas gerais “Não sei informar”.</p>`:''}${!print?`<details><summary>Ver respostas por data</summary><div class="table-scroll"><table class="data-table"><thead><tr><th>Data</th><th>Resposta</th></tr></thead><tbody>${dates.map(d=>`<tr><td>${dateLabel(d)}</td><td>${esc(chartValueText(map.get(d),key))}</td></tr>`).join('')}</tbody></table></div></details>`:''}</article>`;
}
function variationHtml(records,keys=['energy','sleep']){return keys.map(key=>{const vals=records.filter(r=>typeof r[key]==='number').map(r=>r[key]),m=METRICS[key];return `<div class="summary-item"><span>${m.title} · faixa observada</span><strong>${vals.length?esc(labelFor(m.options,Math.min(...vals)))+' → '+esc(labelFor(m.options,Math.max(...vals))):'Sem respostas nesta escala'}</strong><p class="small muted">${vals.length} respostas informadas</p></div>`;}).join('');}
function timelineRow(r,print=false){return `<div class="timeline-row"><div class="timeline-date">${dateLabel(r.date)}</div><div class="timeline-content"><div class="row">${r.feelings.length?r.feelings.map(moodTag).join(''):'<span class="muted">Emoções não informadas</span>'}</div><p class="small muted mt">${esc(intensityText(r))}</p>${transitionList(r)}</div></div>`;}
function chartsView(){const records=filteredRecords();return `${pageHead('Seus dias, em perspectiva','Observe o que você registrou, sem rótulos ou interpretações automáticas.')}<section class="card">${rangeControl()}</section>${statsHtml(records,range.from,range.to)}${!records.length?'<div class="notice mb">Este período ainda não tem registros. Os gráficos mostram as escalas, sem criar valores.</div>':''}<div class="grid2 mb"><section class="card"><h3 class="mb">Emoções relatadas</h3>${frequencyHtml(records)}</section><section class="card"><h3>Variações de sono e energia</h3><div class="stack mt">${variationHtml(records)}</div><p class="small muted mt">Esses limites vêm das respostas. Não medem a duração dos estados nem classificam episódios.</p></section></div><div class="grid2">${Object.keys(METRICS).map(k=>chartHtml(k,records,range.from,range.to)).join('')}</div><section class="card mt"><h3>Linha do tempo emocional</h3><p class="small muted mt">Ordem declarada. Horários aparecem somente quando informados; não são calculadas durações.</p><div class="timeline">${records.length?records.map(r=>timelineRow(r)).join(''):'<p class="empty">Nenhum registro no período.</p>'}</div></section><section class="card mt"><h3 class="mb">Calendário de humor</h3>${calendar(calMonth,{interactive:true})}${legend()}</section>`;}
function defaultReportOptions(){return {from:addDays(today(),-29),to:today(),emotions:true,energy:true,sleep:true,anxiety:true,irritability:true,activities:true,libido:false,extras:false,medication:false,notes:false,noteDates:[]};}
function reportView(){if(!reportOptions)reportOptions=defaultReportOptions();const o=reportOptions;const noteRecords=session.data.records.filter(r=>r.date>=o.from&&r.date<=o.to&&r.note);return `${pageHead('Compartilhe o que faz sentido','Prepare um relatório visual para levar à consulta. Você escolhe o conteúdo.')}<section class="card"><form id="report-form"><div class="range-grid"><label>Data inicial<input name="from" type="date" required min="1900-01-01" max="${today()}" value="${o.from}"></label><label>Data final<input name="to" type="date" required min="1900-01-01" max="${today()}" value="${o.to}"></label></div><p class="small muted mt">Até 366 dias. Períodos longos são divididos em páginas para preservar a leitura.</p><h3 class="mt mb">O que incluir</h3><div class="report-option-grid">${[['emotions','Emoções, intensidades e mudanças'],['energy','Energia'],['sleep','Sono e necessidade de dormir'],['anxiety','Ansiedade'],['irritability','Irritabilidade'],['activities','Atividades diárias'],['libido','Libido · autorizar inclusão'],['extras','Sintomas e seleções adicionais'],['medication','Relatos de medicação e possíveis efeitos adversos'],['notes','Observações pessoais · escolher abaixo']].map(([k,l])=>`<label class="check"><input type="checkbox" name="${k}" data-report-option="${k}" ${o[k]?'checked':''}><span>${l}</span></label>`).join('')}</div>${o.notes?`<div class="notice mt">Marque cada observação que deseja compartilhar. Nenhuma é incluída automaticamente.</div><div class="selection-list">${noteRecords.length?noteRecords.map(r=>`<label class="check"><input type="checkbox" data-report-note="${r.date}" ${o.noteDates.includes(r.date)?'checked':''}><span><strong>${dateLabel(r.date)}</strong><br>${esc(r.note)}</span></label>`).join(''):'<p class="small muted">Não há observações neste intervalo. Aplique as datas para atualizar a lista.</p>'}</div>`:''}<div class="notice mt">O PDF gerado terá informações legíveis, sem criptografia. Confira a prévia e compartilhe apenas com quem você autorizar. Seu nome de usuário não é impresso.</div><button type="submit" class="btn mt">${icon('file')} Visualizar relatório</button></form></section><div id="report-preview" class="report-preview"></div>`;}
function validateRange(from,to){assert(dateValid(from)&&dateValid(to)&&from<=to,'Confira as datas inicial e final; não use datas futuras.');days(from,to);}
function monthsBetween(from,to){const out=[];let current=from.slice(0,7);while(current<=to.slice(0,7)){out.push(current);const d=dateObj(current+'-01');d.setUTCMonth(d.getUTCMonth()+1);current=d.toISOString().slice(0,7);}return out;}
function chunk(items,n){const out=[];for(let i=0;i<items.length;i+=n)out.push(items.slice(i,i+n));return out;}
function reportHeader(title,subtitle){return `<header class="report-head"><div><h2>${esc(title)}</h2><p>${esc(subtitle)}</p></div><div class="report-logo">DIÁRIO DE HUMOR<br><strong>4.0</strong><br>AUTORRELATO</div></header>`;}
function buildReport(o){validateRange(o.from,o.to);const records=filteredRecords(o.from,o.to);assert(records.length,'Nenhum registro no período selecionado. Escolha outro intervalo.');const pages=[],period=`${dateLabel(o.from)} a ${dateLabel(o.to)}`,months=monthsBetween(o.from,o.to),categories=Object.entries({emotions:'emoções',energy:'energia',sleep:'sono',anxiety:'ansiedade',irritability:'irritabilidade',activities:'atividades',libido:'libido',extras:'informações adicionais',medication:'medicação',notes:'observações selecionadas'}).filter(([k])=>o[k]).map(([,l])=>l).join(', ');
 const calendarPages=chunk(months,3);calendarPages.forEach((ms,i)=>{pages.push(reportHeader(i?'Calendário do acompanhamento':'Resumo do acompanhamento',period)+(i?'':statsHtml(records,o.from,o.to,o.emotions))+`<div class="report-calendars ${ms.length===1?'single':''}">${ms.map(m=>calendar(m,{from:o.from,to:o.to,showEmotion:o.emotions})).join('')}</div>`+legend(o.emotions)+(!i&&o.emotions?`<h3 class="mt mb">Frequência das emoções</h3>${frequencyHtml(records)}`:'')+(!i?`<p class="report-warning">Categorias autorizadas: ${esc(categories||'somente presença de registros')}. Respostas ausentes não representam ausência de sintomas.</p>`:''));});
 if(o.emotions){
  // Small, bounded timeline fragments keep A4 pages legible even with 24 changes per day.
  const fragments=[];for(const r of records){const changeParts=r.changes.length?chunk(r.changes,4):[[]];changeParts.forEach((changes,i)=>{fragments.push({r:{...r,changes},part:i+1,parts:changeParts.length,offset:i*4});});}
  const groups=[];let group=[],cost=0;for(const fragment of fragments){const r=fragment.r;const height=27+Math.max(1,Math.ceil(r.feelings.length/6))*24+Math.max(1,Math.ceil(intensityText(r).length/90))*15+(r.changes.length?r.changes.length*24+7:22);if(group.length&&cost+height>780){groups.push(group);group=[];cost=0;}group.push(fragment);cost+=height;}if(group.length)groups.push(group);
  for(const group of groups){pages.push(reportHeader('Evolução emocional',period)+`<p class="report-timeline-note">A sequência é declarada pela pessoa. “Sem horário” preserva a ordem, sem estimar duração. Intensidades descrevem as emoções do dia; não quantificam cada transição.</p><div class="timeline">${group.map(({r,part,parts,offset})=>{let html=timelineRow(r,true);if(parts>1)html=html.replace('</div><div class="timeline-content">',`<br>Parte ${part}/${parts}</div><div class="timeline-content">`).replace(/class="time">(\d+)\./g,(_,n)=>`class="time">${+n+offset}.`);return html;}).join('')}</div><p class="report-warning">${dayCount(o.from,o.to)-records.length} dias sem registro neste período. Somente dias preenchidos aparecem na linha do tempo.</p>`);}
 }
 const keys=['energy','sleep','sleepQuality','anxiety','irritability','libido','activities'].filter(k=>k==='sleepQuality'?o.sleep:o[k]);
 if(keys.length){const allDays=days(o.from,o.to);for(const dateChunk of chunk(allDays,30)){const from=dateChunk[0],to=dateChunk.at(-1),rs=records.filter(r=>r.date>=from&&r.date<=to);if(!rs.length)continue;for(const ks of chunk(keys,6)){let content=reportHeader('Sintomas e rotina',`${dateLabel(from)} a ${dateLabel(to)} · respostas por data`)+`<div class="grid2">${ks.map(k=>chartHtml(k,rs,from,to,{print:true})).join('')}</div>`;if(o.sleep&&ks.includes('sleep')){const v=YESNO.map(([v,l])=>`${l}: ${rs.filter(r=>r.reducedSleep===v).length}`).join(' · ');content+=`<p class="report-warning">Menos sono e pouca necessidade de dormir mais: ${v} · Não respondido: ${rs.filter(r=>r.reducedSleep===null).length}.</p>`;}pages.push(content);}}}
 const additional=[];for(const r of records){const tags=o.extras?r.extras.filter(k=>o.medication||!['medication','adverse'].includes(k)):[];const blocks=[];if(tags.length)blocks.push(['Seleções adicionais',tags.map(k=>EXTRA.find(x=>x[0]===k)[1]).join(' · ')]);if(o.medication&&r.medicationNote)blocks.push(['Relato sobre medicação',r.medicationNote]);if(o.medication&&r.adverseNote)blocks.push(['Possíveis efeitos adversos',r.adverseNote]);if(o.notes&&o.noteDates.includes(r.date)&&r.note)blocks.push(['Observação autorizada',r.note]);for(const [title,txt]of blocks){const parts=splitText(txt,900);parts.forEach((text,i)=>additional.push({date:r.date,title:title+(parts.length>1?` (${i+1}/${parts.length})`:''),text}));}}
 for(const blocks of chunk(additional,2)){pages.push(reportHeader('Informações complementares',period)+blocks.map(b=>`<section class="mb"><h3 class="small">${dateLabel(b.date)} · ${esc(b.title)}</h3><p class="note-text mt">${esc(b.text)}</p></section>`).join('')+`<p class="report-warning">Conteúdo voluntariamente informado e autorizado para este relatório. Seleções não marcadas não indicam ausência de sintomas.</p>`);}
 return pages.map((p,i)=>`<article class="report-paper">${p}<footer class="report-foot"><span>Relatório de autorrelato para acompanhamento clínico. Não constitui diagnóstico.</span><span>${i+1}/${pages.length}</span></footer></article>`).join('');
}
function splitText(text,limit){const out=[];let s=text;while(s.length){let end=Math.min(limit,s.length),lines=0;for(let i=0;i<end;i++){if(s[i]==='\n'&&++lines>=15){end=i+1;break;}}if(end<s.length&&lines<15){const space=s.lastIndexOf(' ',end);if(space>=end/2)end=space;}out.push(s.slice(0,end));s=s.slice(end).trimStart();}return out;}
function updateReportPreview(){const html=buildReport(reportOptions);$('#report-preview').innerHTML=`<div class="report-toolbar"><p class="small"><strong>Prévia do relatório</strong><br>Confira os dados. No diálogo de impressão, escolha “Salvar como PDF”, A4 e desative cabeçalhos e rodapés do navegador.</p><button class="btn" data-action="print">${icon('file')} Imprimir / Salvar como PDF</button></div>${html}`;$('#print-root').innerHTML=html;}
function settingsView(){return `${pageHead('Ajustes e privacidade','Cuide do seu acesso, dos seus backups e do que deseja guardar.')}<section class="card settings-group"><h3>${icon('download')} Backups do diário</h3><p class="small muted">O arquivo JSON contém todo o histórico criptografado. Ele é essencial se você trocar de aparelho ou perder os dados do navegador.</p><p class="small mt">Último download solicitado: <strong>${esc(dateTimeLabel(session.data.lastBackupRequestedAt))}</strong>.</p><div class="row mt"><button class="btn" data-action="backup">Baixar backup agora</button><button class="btn ghost" data-action="restore">Restaurar backup</button></div>${saveInfo?savePanel():''}</section><section class="card settings-group"><h3>${icon('lock')} Bloqueio automático</h3><p class="small muted">A sessão bloqueia ao recarregar ou reabrir o diário. Depois de ficar sem interação pelo tempo abaixo, será necessário entrar novamente.</p><form id="settings-form" class="mt"><label class="field" for="auto-lock">Bloquear após</label><select id="auto-lock" name="autoLockMinutes">${[1,2,5,10,15,30].map(n=>`<option value="${n}" ${session.data.settings.autoLockMinutes===n?'selected':''}>${n} minuto${n===1?'':'s'} sem atividade</option>`).join('')}</select><button type="submit" class="btn secondary mt">Salvar preferência</button></form><p class="small muted mt">Ao trocar de aba, o conteúdo fica encoberto. O tempo de inatividade continua contando. Respostas ainda não salvas são descartadas ao bloquear.</p></section><section class="card settings-group"><h3>Alterar senha</h3><p class="small muted">Os novos dados locais e os próximos backups usarão a nova senha. Arquivos antigos continuam exigindo a senha antiga.</p><form id="password-form"><label class="field" for="current-password">Senha atual</label><input type="password" id="current-password" name="current" autocomplete="current-password" required maxlength="256"><label class="field" for="new-password">Nova senha · pelo menos ${MIN_PASSWORD_LENGTH} caracteres</label><input type="password" id="new-password" name="next" autocomplete="new-password" required minlength="${MIN_PASSWORD_LENGTH}" maxlength="256"><label class="field" for="new-confirm">Confirme a nova senha</label><input type="password" id="new-confirm" name="confirm" autocomplete="new-password" required minlength="${MIN_PASSWORD_LENGTH}" maxlength="256"><button type="submit" class="btn secondary mt">Alterar senha e baixar backup</button></form></section><section class="card settings-group"><h3>Como usar com segurança</h3><details class="optional"><summary>Hospedagem, armazenamento e aparelhos</summary><p class="small muted">Hospede este único HTML em um endereço HTTPS de confiança. Você pode enviá-lo como index.html a uma hospedagem estática. Mantenha o mesmo endereço e o mesmo navegador. Abertura direta por file:// serve apenas para avaliação, pois o armazenamento e as APIs variam.</p><p class="small muted mt">O HTML não envia registros, credenciais ou backups a servidores. O servidor estático pode receber a solicitação da página, como qualquer hospedagem. Não há sincronização: cada navegador possui seu próprio diário. Para levar os dados a outro aparelho, baixe o backup e restaure-o lá.</p><p class="small muted mt">Evite navegação privada. O navegador pode apagar dados em falta de espaço; faça e preserve backups. Abrir a página novamente depende do acesso ao arquivo ou à hospedagem; não há instalação offline ou cache garantido.</p><button class="btn ghost slim mt" data-action="persist-storage">Solicitar preservação do armazenamento</button><p class="small muted mt">Esta solicitação depende do navegador e não substitui o backup.</p></details><details class="optional"><summary>Senhas e arquivos JSON</summary><p class="small muted">O mínimo exigido é ${MIN_PASSWORD_LENGTH} caracteres. Prefira uma frase longa e exclusiva e guarde-a com segurança. Não há recuperação por e-mail. Se a senha for esquecida, os dados protegidos por ela não poderão ser abertos pelo aplicativo.</p><p class="small muted mt">O JSON fica criptografado e não revela o conteúdo clínico no Bloco de Notas. Isso não torna a proteção infalível: ela depende da força da senha, da integridade do dispositivo e do navegador. Quem conhece sua senha e tem seu arquivo pode abri-lo.</p><p class="small muted mt">Senhas e chaves não são gravadas pelo aplicativo. Um gerenciador de senhas do próprio navegador pode oferecer salvá-las; essa decisão é sua.</p><p class="small muted mt">Guarde os backups em uma pasta segura, com cópia em outro lugar. O navegador pode criar cópias com (1), (2) no nome; o arquivo não é sobrescrito automaticamente. Confira a data e mantenha o mais recente.</p></details><details class="optional"><summary>Limpar histórico ou limpar dados do site?</summary><p class="small muted">Limpar somente o histórico de navegação geralmente não remove o IndexedDB. Limpar os dados do site, redefinir o navegador, desinstalá-lo ou usar uma sessão privada pode apagar o diário.</p><p class="small muted mt">Depois de uma limpeza completa, o aplicativo vê um primeiro acesso e não reconhece automaticamente um usuário antigo. Selecione “Restaurar backup existente” e use o JSON e sua senha.</p></details><details class="optional"><summary>Relatório PDF e informações sensíveis</summary><p class="small muted">Em Relatório, escolha as datas e categorias, selecione individualmente as observações e confira a prévia. Toque em “Imprimir / Salvar como PDF”. Na janela do navegador escolha “Salvar como PDF”, papel A4 e desative cabeçalhos e rodapés. Se houver opção, habilite gráficos de fundo.</p><p class="small muted mt">Libido, observações, informações adicionais e medicação ficam excluídas inicialmente. O PDF contém dados legíveis; guarde e compartilhe com cuidado. Não há envio automático ao profissional.</p></details><details class="optional"><summary>Sobre a proteção técnica</summary><p class="small muted">AES-256-GCM com IV aleatório de 96 bits em cada criptografia; PBKDF2-SHA-256 com 600.000 iterações e salt aleatório de 256 bits. O perfil e o histórico são armazenados juntos, criptografados, no IndexedDB.</p><p class="small muted mt">Uma verificação de versão impede que uma aba antiga sobrescreva alterações de outra aba. Nada substitui os backups. O aplicativo não faz diagnóstico, vigilância de risco nem contato com serviços de emergência.</p></details></section><section class="card settings-group danger-zone"><h3>Gerenciar exclusões</h3><p class="small muted">Para excluir apenas um dia, abra-o no Histórico. A exclusão local não remove cópias em backups já baixados ou PDFs já gerados.</p><div class="row mt"><button class="btn danger" data-action="clear-records">Excluir todos os registros</button><button class="btn danger" data-action="reset">Redefinir diário e perfil</button></div></section><button class="btn ghost full" data-action="lock">${icon('exit')} Sair e bloquear</button>`;}
function restoreView(){return `<section class="card"><h2>Restaurar backup existente</h2>${restoreContent()}</section>`;}
function restoreContent(){if(restore?.data){const rs=restore.data.records;return `<p class="small muted mt">Backup aberto localmente. Confira antes de confirmar a restauração.</p><div class="summary-grid"><div class="summary-item"><span>Usuário local</span><strong>${esc(restore.data.profile.username)}</strong></div><div class="summary-item"><span>Registros</span><strong>${rs.length}</strong></div><div class="summary-item"><span>Primeira data</span><strong>${rs.length?dateLabel(rs[0].date):'Histórico vazio'}</strong></div><div class="summary-item"><span>Última data</span><strong>${rs.length?dateLabel(rs.at(-1).date):'Histórico vazio'}</strong></div></div>${vault?'<div class="notice warn">Já existe um perfil neste navegador. Confirmar irá substituir todo o perfil e histórico locais. Não haverá mesclagem. Se precisar, cancele e baixe um backup do diário atual.</div>':'<div class="notice">O perfil e os registros serão recriados neste navegador.</div>'}<div id="restore-error" class="notice error mt" hidden role="alert"></div><div class="row mt"><button class="btn" data-action="restore-confirm">${vault?'Substituir histórico e restaurar':'Confirmar restauração'}</button><button class="btn ghost" data-action="restore-cancel">Cancelar</button></div>`;}
 return `<p class="small muted mt">Escolha o JSON criptografado do Diário de Humor 4.0. Nada será substituído antes de sua confirmação.</p><div id="restore-error" class="notice error mt" hidden role="alert"></div><form id="restore-form"><label class="field" for="backup-file">Arquivo de backup · até 20 MB</label><input id="backup-file" name="file" type="file" accept=".json,application/json" required><label class="field" for="backup-password">Senha usada neste backup</label><input id="backup-password" name="password" type="password" required maxlength="256" autocomplete="off"><button type="submit" class="btn full mt">Abrir backup e visualizar prévia</button><button type="button" class="btn ghost full mt" data-action="restore-cancel">Cancelar</button></form>`;
}
function renderRestore(){if(session){view='restore';render();}else authFrame(`<h2>Restaurar seu diário</h2>${restoreContent()}`);}
async function register(form){const fd=new FormData(form),username=String(fd.get('username')).trim();let password=String(fd.get('password'));assert(password.length>=MIN_PASSWORD_LENGTH&&password.length<=256,`Use uma senha de pelo menos ${MIN_PASSWORD_LENGTH} caracteres.`);assert(password===fd.get('confirmation'),'As senhas não coincidem.');const data=validateData(emptyData(username)),kdf=makeKdf(),key=await derive(password,kdf);password='';const env=await encryptData(data,key,kdf);const saved=await casWrite(env,null);vault=saved;form.reset();activate(data,key,kdf);broadcast('changed');toast('Seu diário foi criado com histórico vazio.');}
async function login(form){const fd=new FormData(form),username=String(fd.get('username')).trim().normalize('NFKC').toLocaleLowerCase('pt-BR');const item=await readVault();assert(item,'Não existe perfil neste navegador. Crie um diário ou restaure um backup.');let unlocked;try{unlocked=await decryptEnvelope(item.envelope,String(fd.get('password')));assert(unlocked.data.profile.username.normalize('NFKC').toLocaleLowerCase('pt-BR')===username);}catch{throw Error('Não foi possível desbloquear. Confira usuário e senha. Se o arquivo local estiver danificado, restaure seu backup.');}vault=item;ivs.add(item.envelope.iv);form.reset();activate(unlocked.data,unlocked.key,unlocked.kdf);}
async function restoreRead(form){const file=form.elements.file.files[0];assert(file&&file.size>0&&file.size<=MAX_FILE,'Escolha um JSON válido com até 20 MB.');let env;try{env=JSON.parse(await file.text());}catch{throw Error('O arquivo não é um JSON válido. Selecione um backup criptografado do diário.');}validateEnvelope(env);let password=form.elements.password.value;const currentEpoch=epoch;const unlocked=await decryptEnvelope(env,password);const kdf=makeKdf(),key=await derive(password,kdf);password='';form.reset();assert(epoch===currentEpoch,'A sessão mudou. Abra o backup novamente.');restore={data:unlocked.data,key,kdf,expectedRevision:(await readVault())?.revision||null};lastActivity=Date.now();renderRestore();}
async function restoreConfirm(){assert(restore?.data,'Selecione e abra um backup primeiro.');const current=restore,atEpoch=epoch;const env=await encryptData(current.data,current.key,current.kdf);assert(restore===current&&epoch===atEpoch,'A restauração expirou. Abra o backup novamente.');const saved=await casWrite(env,current.expectedRevision);vault=saved;activate(current.data,current.key,current.kdf);broadcast('changed');toast('Perfil e histórico restaurados. Use o mesmo usuário e a senha do backup.');}
async function startRestore(){if(!await canLeave())return;restore=null;renderRestore();}
async function openEntry(date){assert(dateValid(date),'Escolha uma data válida, até hoje.');if(!await canLeave())return;const r=session.data.records.find(x=>x.date===date);draft=r?clone(r):emptyRecord(date);formBaseDate=r?date:null;step=0;dirty=false;view='form';saveInfo=null;render();window.scrollTo({top:0});}
async function canLeave(){if(!dirty)return true;const yes=await dialog({title:'Sair do preenchimento?',html:'<p>As respostas que ainda não foram salvas serão descartadas. Você pode continuar preenchendo para salvá-las.</p>',confirm:'Descartar respostas',cancel:'Continuar preenchendo',danger:true});if(yes){dirty=false;draft=null;}return !!yes;}
async function navigate(target){if(!session)return;if(!await canLeave())return;restore=null;view=target;render();window.scrollTo({top:0});}
function requestDownload(){assert(preparedBackup&&blobURL,'Prepare o backup antes de baixar.');const link=document.createElement('a');link.href=blobURL;link.download=`diario-humor-backup-${today()}.json`;link.rel='noopener';document.body.append(link);try{link.click();}finally{link.remove();}}
async function prepareBackup(){assert(session,'Entre para baixar seu backup.');const currentEpoch=epoch,env=await encryptData(session.data,session.key,session.kdf);assert(session&&epoch===currentEpoch,'Sessão bloqueada. Entre novamente para baixar.');releaseBackup();const text=JSON.stringify(env,null,2);preparedBackup=env;blobURL=URL.createObjectURL(new Blob([text],{type:'application/json;charset=utf-8'}));}
async function markRequested(){const next=clone(session.data);next.lastBackupRequestedAt=new Date().toISOString();await commitData(next,{keepBackup:true});}
async function backupAfterSave(title='Registro salvo localmente',date=null){saveInfo={title,date,prepared:false,requested:false,error:''};try{await prepareBackup();saveInfo.prepared=true;requestDownload();saveInfo.requested=true;try{await markRequested();}catch(e){saveInfo.error='O registro e o backup foram preparados, mas não foi possível atualizar a data do download: '+e.message;}}catch(e){if(saveInfo)saveInfo.error='Os dados locais estão salvos. O backup precisa ser baixado novamente: '+e.message;}}
async function saveEntry(){assert(draft,'Abra o formulário para preencher.');const r=clone(draft);r.updatedAt=new Date().toISOString();validateRecord(r);const has= r.feelings.length||r.extras.length||Object.keys(SCALAR_OPTIONS).some(k=>r[k]!==null)||r.note||r.medicationNote||r.adverseNote||r.riskHelp;assert(has,'Responda ao menos uma pergunta. Os demais campos podem ficar em branco.');const next=clone(session.data);const i=next.records.findIndex(x=>x.date===r.date);if(i>=0)next.records[i]=r;else next.records.push(r);await commitData(next);dirty=false;draft=null;await backupAfterSave('Registro salvo localmente',r.date);if(session){view='home';render();window.scrollTo({top:0});if(riskMention(r)){const support=document.createElement('section');support.innerHTML=warningSupport();$('.save-state')?.append(support);}}}
async function deleteEntry(date){const ok=await dialog({title:'Excluir este dia?',html:`<p>O registro de ${dateLabel(date)} será removido deste navegador. Backups e PDFs já guardados não serão apagados. Um novo backup será solicitado com o histórico restante.</p>`,confirm:'Excluir registro',danger:true});if(!ok)return;await task(async()=>{const next=clone(session.data);next.records=next.records.filter(r=>r.date!==date);await commitData(next);await backupAfterSave('Registro excluído localmente');view='home';render();});}
async function verifyCurrentPassword(password){assert(vault,'Perfil local não encontrado.');const current=await readVault();assert(current?.revision===vault.revision,'O diário mudou em outra aba. Entre novamente.');await decryptEnvelope(current.envelope,password);}
async function changePassword(form){let current=form.elements.current.value,next=form.elements.next.value;assert(next.length>=MIN_PASSWORD_LENGTH&&next.length<=256,`A nova senha deve ter pelo menos ${MIN_PASSWORD_LENGTH} caracteres.`);assert(next===form.elements.confirm.value,'A confirmação da nova senha não coincide.');await verifyCurrentPassword(current);current='';const kdf=makeKdf(),key=await derive(next,kdf);next='';await commitData(clone(session.data),{newKey:key,newKdf:kdf});form.reset();await backupAfterSave('Senha alterada e dados protegidos');view='settings';render();toast('A nova senha já está em uso. Backups anteriores continuam com a senha antiga.');}
async function destructive(reset=false){const action=reset?'REDEFINIR':'APAGAR';const ok=await dialog({title:reset?'Redefinir diário e perfil?':'Excluir todos os registros?',html:`<p>${reset?'O perfil e todo o histórico local serão excluídos.':'Todos os registros serão apagados; seu usuário e sua senha continuarão funcionando.'} Isso não apaga backups ou PDFs existentes. Faça um backup antes, se quiser preservar seus dados.</p><p>Digite <strong>${action}</strong> e confirme sua senha atual.</p><label class="field" for="destructive-password">Senha atual</label><input id="destructive-password" type="password" autocomplete="current-password" maxlength="256">`,confirm:'Confirmar exclusão',danger:true,input:true});if(!ok)return;assert(ok.text===action,'A palavra de confirmação não confere.');await task(async()=>{await verifyCurrentPassword(ok.password);if(reset){vault=await casWrite(null,vault.revision);broadcast('changed');lockSession('O diário foi redefinido. Backups antigos continuam existindo.');}else{const next=clone(session.data);next.records=[];await commitData(next);await backupAfterSave('Histórico apagado; perfil mantido');view='home';render();}});}
async function handleAction(action){
 if(action==='register')return renderAuth('register');if(action==='welcome')return renderAuth(vault?'login':'welcome');if(action==='restore')return startRestore();if(action==='restore-cancel'){restore=null;if(session){view='settings';render();}else renderAuth(vault?'login':'welcome');return;}if(action==='restore-confirm')return task(restoreConfirm,'Restaurando seu histórico…');
 if(!session)return;
 switch(action){
 case 'lock':if(await canLeave())lockSession('',true);break;
 case 'fill-today':await openEntry(today());break;
 case 'next-step':step=Math.min(2,step+1);render();window.scrollTo({top:0});break;
 case 'previous-step':step=Math.max(0,step-1);render();window.scrollTo({top:0});break;
 case 'cancel-form':await navigate('home');break;
 case 'add-change':if(draft.changes.length<24){draft.changes.push({from:'',to:'',time:null});dirty=true;render();}break;
 case 'save-entry':await task(saveEntry,'Salvando e preparando seu backup…');break;
 case 'backup':await task(async()=>{await backupAfterSave('Histórico salvo localmente');render();if(view!=='home'&&view!=='settings')toast(saveInfo.requested?'Backup preparado; download solicitado. Confira seus downloads.':saveInfo.error||'O backup não foi concluído. Tente novamente.');},'Preparando backup completo…');break;
 case 'download-ready':{try{requestDownload();if(saveInfo)saveInfo.requested=true;toast('Download solicitado. Confira se o JSON foi guardado.');await task(async()=>{await markRequested();render();});}catch{toast('Não foi possível solicitar o download. Tente o botão Backup novamente.');}break;}
 case 'month-prev':case 'month-next':{const d=dateObj(calMonth+'-01');d.setUTCMonth(d.getUTCMonth()+(action==='month-next'?1:-1));if(d.toISOString().slice(0,7)>='1900-01'&&d.toISOString().slice(0,7)<=today().slice(0,7))calMonth=d.toISOString().slice(0,7);render();break;}
 case 'print':assert(reportReady,'Gere a prévia primeiro.');lastActivity=Date.now();window.print();toast('Janela de impressão solicitada. Escolha Salvar como PDF; o aplicativo não confirma a gravação.');break;
 case 'clear-records':await destructive(false);break;
 case 'reset':await destructive(true);break;
 case 'persist-storage':{if(!navigator.storage?.persist){toast('Este navegador não oferece essa solicitação. Continue guardando backups.');break;}const ok=await navigator.storage.persist();toast(ok?'O navegador concedeu armazenamento persistente. Mantenha seus backups.':'O navegador não concedeu a solicitação. Continue guardando backups.');break;}
 }
}
document.addEventListener('click',async e=>{const modalButton=e.target.closest('[data-modal]');if(modalButton){if(modalButton.dataset.modal==='ok'){const text=$('#dialog-input')?.value,password=$('#destructive-password')?.value;hideModal(text!==undefined?{text,password}:true);}else hideModal(false);return;}
 if(busy)return;const b=e.target.closest('button');if(!b)return;try{
 if(b.dataset.nav)return await navigate(b.dataset.nav);if(b.dataset.action)return await handleAction(b.dataset.action);if(!session)return;
 if(b.dataset.edit)return await openEntry(b.dataset.edit);if(b.dataset.delete)return await deleteEntry(b.dataset.delete);
 if(b.dataset.field){const field=b.dataset.field,value=JSON.parse(b.dataset.value);if(field==='moodChanged'&&value!=='yes'&&draft.changes.length){const ok=await dialog({title:'Remover as mudanças detalhadas?',html:'<p>Essa resposta vai remover as mudanças adicionadas a este dia. Os outros campos serão preservados.</p>',confirm:'Remover mudanças',cancel:'Manter como está'});if(!ok)return;draft.changes=[];}draft[field]=value;dirty=true;render();return;}
 if(b.dataset.multi){const key=b.dataset.multi,v=b.dataset.value,idx=draft[key].indexOf(v);if(idx>=0){draft[key].splice(idx,1);if(key==='feelings')delete draft.intensities[v];}else draft[key].push(v);dirty=true;render();return;}
 if(b.dataset.removeChange!==undefined){draft.changes.splice(+b.dataset.removeChange,1);dirty=true;render();return;}
 if(b.dataset.day){historyDate=b.dataset.day;calMonth=historyDate.slice(0,7);view='history';render();return;}
 if(b.dataset.period){range={from:addDays(today(),1-Number(b.dataset.period)),to:today()};render();}
 }catch(err){toast(err.message);}
});
document.addEventListener('input',e=>{const t=e.target;if(!session||busy)return;if(t.dataset.text&&draft){draft[t.dataset.text]=t.value;dirty=true;const box=$('#risk-notice');if(box)box.innerHTML=riskMention(draft)?warningSupport():'';}if(t.dataset.change!==undefined&&draft){draft.changes[+t.dataset.change][t.dataset.part]=t.value||null;dirty=true;}});
document.addEventListener('change',async e=>{if(busy)return;const t=e.target;try{
 if(t.id==='entry-date'){const chosen=t.value;if(!dateValid(chosen)){t.value=draft.date;return toast('Escolha uma data válida, até hoje.');}if(chosen===draft.date)return;const previous=draft.date;if(!await canLeave()){t.value=previous;return;}await openEntry(chosen);return;}
 if(!session)return;
 if(t.dataset.intensity){const k=t.dataset.intensity;if(t.value==='general')delete draft.intensities[k];else draft.intensities[k]=JSON.parse(t.value);dirty=true;return;}
 if(t.dataset.change!==undefined){draft.changes[+t.dataset.change][t.dataset.part]=t.value||null;dirty=true;return;}
 if(t.hasAttribute('data-risk')){draft.riskHelp=t.checked;dirty=true;$('#risk-notice').innerHTML=riskMention(draft)?warningSupport():'';return;}
 if(t.id==='history-jump'){assert(dateValid(t.value),'Escolha uma data válida, até hoje.');historyDate=t.value;calMonth=t.value.slice(0,7);render();return;}
 if(t.dataset.reportOption){reportOptions[t.dataset.reportOption]=t.checked;clearReport();render();return;}
 if(t.dataset.reportNote){const date=t.dataset.reportNote;reportOptions.noteDates=reportOptions.noteDates.filter(x=>x!==date);if(t.checked)reportOptions.noteDates.push(date);clearReport();return;}
 if(t.closest('#report-form')&&['from','to'].includes(t.name)){reportOptions[t.name]=t.value;clearReport();render();}
 }catch(err){toast(err.message);}
});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target;if(busy)return;task(async()=>{switch(form.id){case 'register-form':return register(form);case 'login-form':return login(form);case 'restore-form':return restoreRead(form);case 'settings-form':{const next=clone(session.data);next.settings.autoLockMinutes=Number(form.elements.autoLockMinutes.value);await commitData(next);toast('Preferência salva.');render();break;}case 'password-form':return changePassword(form);case 'range-form':{const fd=new FormData(form);validateRange(fd.get('from'),fd.get('to'));range={from:fd.get('from'),to:fd.get('to')};render();break;}case 'report-form':{validateRange(reportOptions.from,reportOptions.to);buildReport(reportOptions);reportReady=true;updateReportPreview();$('#report-preview').scrollIntoView({behavior:'smooth',block:'start'});break;}}});});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)hideModal(false);if(e.key==='Tab'&&!$('#modal').hidden){const list=$$('button,input,select,textarea,a[href]', $('#modal')).filter(x=>!x.disabled),first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
function activeTimeout(){return (session?.data.settings.autoLockMinutes||restore?.data?.settings.autoLockMinutes||5)*60000;}
function activity(){if(!session&&!restore?.data)return;const timeout=activeTimeout();if(Date.now()-lastActivity>=timeout){if(busy)pendingLock=true;else lockSession('Sessão bloqueada por inatividade. As respostas não salvas não foram mantidas.');}else lastActivity=Date.now();}
for(const ev of ['pointerdown','keydown','input','touchstart','scroll'])document.addEventListener(ev,activity,{passive:true,capture:true});
setInterval(()=>{if((session||restore?.data)&&Date.now()-lastActivity>=activeTimeout()){if(busy)pendingLock=true;else lockSession('Sessão bloqueada por inatividade. As respostas não salvas não foram mantidas.');}},1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){$('#privacy-curtain').hidden=false;}else{if((session||restore?.data)&&Date.now()-lastActivity>=activeTimeout())lockSession('Sessão bloqueada por inatividade.');$('#privacy-curtain').hidden=true;}});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
window.addEventListener('pagehide',()=>{if(session||restore?.data)lockSession();});
window.addEventListener('pageshow',e=>{if(e.persisted){$('#privacy-curtain').hidden=true;lockSession();}});
window.addEventListener('beforeprint',()=>{if(!session||!reportReady)$('#print-root').replaceChildren();});
window.addEventListener('afterprint',()=>{if(session)lastActivity=Date.now();});
async function boot(){try{if(!globalThis.crypto?.subtle||!globalThis.isSecureContext||!globalThis.indexedDB)throw Error('Este ambiente não oferece criptografia e armazenamento seguros. Abra o HTML em uma hospedagem HTTPS, no Safari, Chrome, Edge ou Firefox atual. Em desenvolvimento, use localhost.');db=await openDB();vault=await readVault();if(vault){try{validateEnvelope(vault.envelope);}catch{renderAuth('login','Os dados locais não puderam ser validados. Você pode restaurar um backup íntegro.');return;}}renderAuth(vault?'login':'welcome');}catch(err){authFrame(`<h2>Vamos proteger seu diário</h2><div class="notice warn mt">${esc(err.message)}</div><p class="small muted mt">O aplicativo não gravará dados sem proteção. Se você já possui um backup, guarde-o e tente abrir o diário em um endereço HTTPS confiável. Se o armazenamento local estiver danificado, não o apague antes de localizar seu último JSON.</p>`);}}
boot();
})();
